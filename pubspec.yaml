name: fieldinfo
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Supabase / config
  supabase_flutter: ^2.6.0
  flutter_dotenv: ^5.2.1

  # State management
  provider: ^6.0.5

  # Offline/unlock helpers
  flutter_secure_storage: ^9.2.2
